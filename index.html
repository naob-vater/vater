<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vater</title>
<link rel="preload" href="lyd.mp3" as="audio">
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
*{box-sizing:border-box}
#intro{position:fixed;inset:0;padding:22px 18px;font:16px/1.4 "Times New Roman",Times,serif;background:#fff}
#intro a{color:#0000ee;text-decoration:underline;cursor:pointer}
#stage{position:fixed;inset:0;display:none;background:#000;overflow:hidden;font-family:Impact,"Arial Black",sans-serif}
#stage.on{display:block}
.scn{position:absolute;inset:0;display:none;overflow:hidden}
#bg{display:block;background:#000}
.party #bg{animation:party .35s steps(2) infinite}
@keyframes party{0%{background:#ff00c8}50%{background:#00ffea}100%{background:#fff200}}
#rainbow{position:absolute;inset:-20%;opacity:0;pointer-events:none;background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);mix-blend-mode:screen;transition:opacity .6s}
.party #rainbow{opacity:.55;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* scenes */
[data-scene=snow] #snow,[data-scene=glide] #sky,[data-scene=water] #sea,[data-scene=fire] #city{display:block}
#snow{background:linear-gradient(#7ec8ff 0 35%,#fff 35%)}
#hill{position:absolute;left:-20%;right:-20%;top:30%;height:140%;background:#f4f8ff;transform:rotate(-14deg);border-top:6px solid #cfe0f5}
.tree{position:absolute;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:70px solid #1d7a2c;animation:treego 2.2s linear forwards}
.tree::after{content:"";position:absolute;left:-5px;top:70px;width:10px;height:16px;background:#6b3e1f}
@keyframes treego{from{transform:translate(110vw,-10vh)}to{transform:translate(-30vw,40vh)}}
#sky{background:linear-gradient(#2d8cff,#9fd6ff 70%,#d9f1ff)}
.cloud{position:absolute;width:160px;height:56px;border-radius:50px;background:#fff;box-shadow:40px -20px 0 6px #fff,-30px -10px 0 2px #fff;animation:cloud 6s linear forwards}
@keyframes cloud{from{transform:translateX(110vw)}to{transform:translateX(-60vw)}}
#sea{background:linear-gradient(#ffb36b,#ffd9a0 40%,#1a8fd6 40%,#0b5fa8)}
#waves{position:absolute;left:0;right:0;top:40%;bottom:0;background:repeating-linear-gradient(170deg,transparent 0 22px,rgba(255,255,255,.35) 22px 26px);animation:wave 1s linear infinite}
@keyframes wave{to{background-position:-120px 30px}}
#city{background:linear-gradient(#2a0d3a,#ff6a00 85%)}
#tower{position:absolute;left:8%;width:62%;top:-10%;bottom:0;background:#6d6f78;border-left:6px solid #3d3f48;
  background-image:repeating-linear-gradient(90deg,transparent 0 18px,#6d6f78 18px 52px),repeating-linear-gradient(0deg,#1d2a3a 0 34px,#6d6f78 34px 60px)}
.flame{position:absolute;width:44px;height:40px;background:radial-gradient(circle at 50% 80%,#fff36b,#ff7a00 50%,transparent 70%);animation:flick .3s infinite alternate}
@keyframes flick{to{transform:scale(1.2,1.4) translateY(-6px);opacity:.75}}
#ladder{position:absolute;left:calc(58% - 70px);width:140px;top:-10%;bottom:0;border-left:10px solid #d01010;border-right:10px solid #d01010;
  background:repeating-linear-gradient(0deg,transparent 0 34px,#d01010 34px 44px)}
/* character */
#char{position:absolute;left:50%;top:50%;width:var(--w);transform:translate(-50%,-50%);--w:min(96vw,calc(88vh * 700 / 883));z-index:5}
[data-scene=snow] #char,[data-scene=water] #char,[data-scene=fire] #char{--w:min(36vw,calc(30vh * 700 / 883))}
[data-scene=glide] #char{--w:min(34vw,calc(26vh * 700 / 883))}
[data-scene=snow] #char{animation:ride 1.4s ease-in-out infinite}
@keyframes ride{0%,100%{transform:translate(-62%,-52%) rotate(-12deg)}50%{transform:translate(-38%,-42%) rotate(9deg)}}
[data-scene=glide] #char{animation:drift 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(-70%,-10%) rotate(-6deg)}50%{transform:translate(-30%,-25%) rotate(7deg)}}
[data-scene=water] #char{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-45%,-50%) rotate(-5deg)}50%{transform:translate(-55%,-44%) rotate(4deg)}}
[data-scene=fire] #char{left:58%;animation:climb 26s linear forwards}
@keyframes climb{0%{transform:translate(-50%,-95%)}100%{transform:translate(-50%,-18%)}}
#rig{position:relative;width:100%;aspect-ratio:700/883}
#face{position:absolute;inset:0;animation:jerk 4.3s infinite}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fry 3.1s infinite;filter:contrast(1.5) saturate(2)}
[data-scene=snow] #photo,[data-scene=glide] #photo,[data-scene=water] #photo,[data-scene=fire] #photo{clip-path:ellipse(40% 47% at 50% 48%)}
@keyframes fry{0%{filter:contrast(1.5) saturate(2)}20%{filter:contrast(2.6) saturate(4) hue-rotate(20deg)}21%{filter:contrast(1.2) invert(1)}23%{filter:contrast(2) saturate(3)}60%{filter:contrast(1.8) saturate(5) hue-rotate(-40deg) brightness(1.2)}100%{filter:contrast(1.5) saturate(2)}}
@keyframes jerk{0%,100%{transform:none}10%{transform:skew(8deg,-3deg) scale(1.06)}11%{transform:skew(-6deg) scaleX(1.3)}30%{transform:rotate(3deg)}52%{transform:scaleY(.8) translateY(8%)}53%{transform:scale(1.4) rotate(-6deg)}70%{transform:skewY(5deg)}}
.ov{position:absolute;pointer-events:none}
#eyes{left:0;top:0;width:100%;height:100%;z-index:6}
.eye{position:absolute;width:2px;height:2px}
#glasses{left:45%;top:48.3%;width:68%;z-index:5;opacity:.62;transform:translate(-50%,-700%) rotate(-11deg);transition:transform 1.4s cubic-bezier(.3,1.6,.6,1)}
#glasses.down{transform:translate(-50%,-50%) rotate(-11deg)}
#glasses.off{transition:transform 1s ease-in;transform:translate(160%,-900%) rotate(700deg)}
#bday{left:50%;top:-30%;width:42%;z-index:4;transform:translate(-50%,-300%) rotate(400deg);transition:transform 1.5s cubic-bezier(.2,1.4,.4,1)}
#bday.on{transform:translate(-50%,0) rotate(12deg)}
#cap{left:50%;top:-3%;width:66%;z-index:4;transform:translate(-50%,-38%) rotate(-9deg);display:none}
#vater{left:50%;top:-29%;width:86%;z-index:7;display:none;transform:translate(-50%,-900%);transition:transform .7s cubic-bezier(.5,0,1,.6)}
#vater.land{transform:translate(-50%,0)}
#vater.bal{animation:wob 1.3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translate(-50%,0) rotate(-7deg)}50%{transform:translate(-44%,0) rotate(8deg)}}
#joint{left:62.5%;top:66.5%;margin-top:-3%;width:30%;z-index:4;transform-origin:0 50%;transform:rotate(-200deg) scale(0);transition:transform 1.3s cubic-bezier(.3,1.5,.5,1)}
#joint.on{transform:rotate(14deg) scale(1)}
/* body */
#body{position:relative;display:none;width:124%;margin-left:-12%;margin-top:-30%;z-index:-1}
[data-scene=snow] #body,[data-scene=water] #body,[data-scene=fire] #body{display:block}
#body svg{display:block;width:100%;height:auto;overflow:visible}
.uni{display:none}[data-scene=fire] .uni{display:inline}[data-scene=fire] .civ{display:none}
.arm{position:absolute;top:22%;width:30%}
#armL{left:-6%}#armR{right:-6%;transform:scaleX(-1)}
#monrad{position:absolute;right:-48%;top:22%;width:58%;display:none;transform:rotate(-12deg);font:64px/1 sans-serif;text-align:center;color:#fff}
#monrad svg{width:100%}
[data-scene=fire] #monrad{display:block}
#board,#skis{position:absolute;left:-30%;right:-30%;bottom:-5%;height:7%;display:none;border:4px solid #000;border-radius:40px}
#board{background:repeating-linear-gradient(90deg,#ff2a6d 0 18px,#ffd319 18px 36px);transform:rotate(-4deg)}
[data-scene=snow] #board{display:block}
#skis{background:linear-gradient(#ffe100 0 45%,#000 45% 55%,#ffe100 55%);transform:rotate(3deg)}
[data-scene=water] #skis{display:block}
#rope{position:absolute;right:62%;top:52%;width:120vw;height:3px;background:#222;transform-origin:100% 50%;transform:rotate(-8deg);display:none}
[data-scene=water] #rope{display:block}
#canopy{position:absolute;left:-95%;width:290%;bottom:118%;display:none}
[data-scene=glide] #canopy{display:block}
#beams{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
.leaf{position:absolute;width:70px;pointer-events:none;animation:leaf 3s linear forwards;z-index:3}
@keyframes leaf{to{transform:translateY(110vh) rotate(540deg)}}
.puff{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(230,230,230,.7);animation:puff 2.4s ease-out forwards;pointer-events:none;z-index:6}
@keyframes puff{to{transform:translate(40px,-160px) scale(4);opacity:0}}
/* targets */
.tgt{position:absolute;z-index:7;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.tgt.card{width:clamp(110px,26vw,190px);background:#fff;padding:6px 6px 4px;border:1px solid #999;box-shadow:3px 3px 0 #000}
.tgt img,.tgt svg{display:block;width:100%;height:auto}
.tgt.card svg{background:#eee}
.tgt.free{width:clamp(80px,20vw,140px)}
.tgt .emo{font:clamp(56px,14vw,96px)/1 sans-serif;text-align:center}
.tgt p{margin:4px 0 0;font:11px/1.2 Arial,sans-serif;color:#333;opacity:0;transition:opacity 1.2s .3s}
.tgt p.in{opacity:1}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.fly{animation:fly 5s linear forwards}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(-140vw) translateY(10vh)}}
.swim{animation:swim 1.2s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}
.hit{animation:burn .7s forwards!important}
@keyframes burn{0%{filter:none}30%{filter:brightness(3) sepia(1) hue-rotate(-30deg) saturate(8);scale:1.15}60%{filter:brightness(.4) contrast(3);scale:.9}100%{filter:brightness(0) blur(6px);scale:.2;opacity:0}}
.frag{position:absolute;width:14px;height:14px;z-index:9;pointer-events:none;animation:frag .9s ease-out forwards}
@keyframes frag{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.boomtxt{position:absolute;z-index:10;font:clamp(28px,8vw,56px) Impact,sans-serif;color:#ff0;-webkit-text-stroke:2px #f00;pointer-events:none;animation:boomt .9s ease-out forwards}
@keyframes boomt{from{transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}60%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg)}to{transform:translate(-50%,-80%) scale(1.2);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11}
#flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.stk{position:absolute;z-index:7;width:clamp(70px,18vw,120px);pointer-events:none;animation:stk 3.6s ease-in-out forwards}
.stk svg{width:100%}
@keyframes stk{0%{transform:scale(0)}15%{transform:scale(1.1) rotate(-12deg)}85%{transform:scale(1) rotate(10deg)}100%{transform:scale(0) rotate(40deg)}}
#sound{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;padding:10px 18px;border:3px solid #fff;background:rgba(0,0,0,.45);color:#fff;font:22px Impact,"Arial Black",sans-serif;white-space:nowrap;cursor:pointer;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:translateX(-50%) scale(1)}50%{opacity:.85;transform:translateX(-50%) scale(1.08)}}
#sound.ok{animation-duration:2.4s}
</style>
</head>
<body>

<div id="stage">

<audio id="aud" src="lyd.mp3" loop playsinline preload="auto"></audio>

<script>
{
const $=s=>document.querySelector(s);
const stage=$('#stage'),beams=$('#beams'),snd=$('#sound'),aud=$('#aud');
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const later=(ms,f)=>setTimeout(f,ms);
let started=false;

/* ---------- AUDIO: start in the same tick as the tap ---------- */
try{aud.load()}catch(e){}
let ac=null;
function getAC(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function unlock(){const c=getAC();if(!c)return;try{c.resume&&c.resume().catch(()=>{});const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}}
function ok(){snd.classList.add('ok')}
function play(){
  aud.muted=false;
  const p=aud.play();
  if(p&&p.then)p.then(ok).catch(()=>{aud.muted=true;aud.play().catch(()=>{})});
}
aud.addEventListener('playing',()=>{if(!aud.muted)ok()});
['pointerdown','touchstart','touchend','click','keydown','scroll','wheel'].forEach(ev=>addEventListener(ev,()=>{if(started&&(aud.paused||aud.muted))play()},{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&started&&aud.paused)play()});
snd.addEventListener('click',play);
function sfx(kind){
  const c=ac;if(!c||c.state!=='running')return;const t=c.currentTime;
  if(kind==='laser'){const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1800,t);o.frequency.exponentialRampToValueAtTime(120,t+.45);g.gain.setValueAtTime(.06,t);g.gain.linearRampToValueAtTime(0,t+.45);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.5)}
  else{const b=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=900;g.gain.value=kind==='big'?.6:.3;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}
}

/* ---------- crude drawings ---------- */
const S=(bg,body)=>`<svg viewBox="0 0 120 110"><rect width="120" height="110" fill="${bg}"/>${body}</svg>`;
const K='stroke="#000" stroke-width="2.5"';
const PEOPLE=[
 {n:['Eldre dame røyker sigar','Eldre dame røyker sigar på terrassen','Bestemor med sigar, ser fornøyd ut'],
  s:S('#bfe3ff',`<path d="M20 110 Q60 70 100 110" fill="#8a3fa8" ${K}/><circle cx="60" cy="16" r="10" fill="#ddd" ${K}/><ellipse cx="60" cy="48" rx="24" ry="28" fill="#f2c9a5" ${K}/><path d="M36 40 Q38 18 60 18 Q84 18 84 40 Q72 30 60 30 Q48 30 36 40Z" fill="#ddd" ${K}/><circle cx="50" cy="46" r="7" fill="none" ${K}/><circle cx="70" cy="46" r="7" fill="none" ${K}/><path d="M50 62 Q60 68 70 62" fill="none" ${K}/><rect x="66" y="60" width="34" height="7" fill="#6b3a1a" ${K} transform="rotate(-8 66 60)"/><circle cx="102" cy="55" r="3" fill="#f40"/><circle cx="106" cy="40" r="6" fill="#ccc" opacity=".8"/><circle cx="110" cy="26" r="8" fill="#ccc" opacity=".6"/>`)},
 {n:['Mann smiler lurt med joint','Avslappet mann smiler lurt','Mann med solbriller og joint, smiler lurt'],
  s:S('#ffe27a',`<path d="M15 110 Q60 72 105 110" fill="#2b2b2b" ${K}/><ellipse cx="60" cy="50" rx="23" ry="30" fill="#e8b88f" ${K}/><path d="M36 40 Q38 8 60 8 Q84 8 84 40 Z" fill="#3c7d3c" ${K}/><rect x="42" y="44" width="15" height="8" fill="#111"/><rect x="63" y="44" width="15" height="8" fill="#111"/><path d="M57 47h6" ${K}/><path d="M48 64 Q62 72 74 62" fill="none" ${K}/><path d="M52 74 Q60 84 68 74" fill="#7a4a2a"/><rect x="72" y="62" width="30" height="5" fill="#f5efe0" ${K} transform="rotate(-14 72 62)"/><circle cx="104" cy="54" r="3" fill="#f60"/>`)},
 {n:['Dame ler alene med salat','Kvinne ler hjertelig av salaten sin','Glad kvinne og salat'],
  s:S('#fff',`<path d="M15 110 Q60 76 105 110" fill="#ff9ac1" ${K}/><path d="M30 60 Q26 10 60 12 Q94 10 90 60 Z" fill="#c9862b" ${K}/><ellipse cx="60" cy="48" rx="21" ry="26" fill="#f6d2b4" ${K}/><path d="M48 44 q4 -4 8 0M64 44 q4 -4 8 0" fill="none" ${K}/><path d="M46 56 Q60 78 74 56 Z" fill="#8b0000" ${K}/><path d="M20 92 Q40 112 60 92 Z" fill="#fff" ${K}/><circle cx="30" cy="90" r="6" fill="#4caf50"/><circle cx="40" cy="88" r="7" fill="#7bd15a"/><circle cx="50" cy="91" r="5" fill="#e53935"/>`)},
 {n:['Forretningsmann gir tommel opp','Mann i dress, tommel opp, isolert på hvit bakgrunn','Suksessfull forretningsmann'],
  s:S('#fff',`<path d="M10 110 Q60 64 110 110" fill="#333a55" ${K}/><path d="M56 78 L60 110 L64 78Z" fill="#c00"/><ellipse cx="60" cy="44" rx="20" ry="25" fill="#f0c7a2" ${K}/><path d="M40 34 Q44 14 62 16 Q80 18 80 34 Q70 26 40 34Z" fill="#5a3b1e" ${K}/><circle cx="52" cy="42" r="2.5"/><circle cx="68" cy="42" r="2.5"/><path d="M50 56 Q60 63 70 56" fill="none" ${K}/><rect x="86" y="62" width="16" height="18" rx="4" fill="#f0c7a2" ${K}/><rect x="90" y="44" width="7" height="20" rx="3" fill="#f0c7a2" ${K}/>`)},
 {n:['Katt i solbriller','Kul katt med solbriller','Katt, solbriller, sommer'],
  s:S('#9fffb0',`<path d="M30 40 L36 10 L52 30Z M90 40 L84 10 L68 30Z" fill="#f39c33" ${K}/><ellipse cx="60" cy="58" rx="36" ry="32" fill="#f39c33" ${K}/><rect x="34" y="46" width="22" height="12" fill="#111"/><rect x="64" y="46" width="22" height="12" fill="#111"/><path d="M56 50h8" ${K}/><path d="M56 68 L60 72 L64 68Z" fill="#f78"/><path d="M60 72 Q52 80 46 74M60 72 Q68 80 74 74" fill="none" ${K}/><path d="M20 66h20M20 74h20M80 66h20M80 74h20" stroke="#000" stroke-width="1.5"/>`)},
 {n:['Pensjonist med VR-briller','Eldre mann oppdager virtuell virkelighet','Bestefar i VR, overrasket'],
  s:S('#ffd1f0',`<path d="M15 110 Q60 74 105 110" fill="#7a8a5a" ${K}/><ellipse cx="60" cy="50" rx="22" ry="28" fill="#f2c9a5" ${K}/><path d="M38 36 Q60 14 82 36" fill="none" stroke="#ccc" stroke-width="6"/><rect x="36" y="38" width="48" height="18" rx="4" fill="#222" ${K}/><ellipse cx="60" cy="68" rx="7" ry="9" fill="#5a1010" ${K}/><path d="M40 62 Q36 76 46 80M80 62 Q84 76 74 80" fill="none" stroke="#ccc" stroke-width="3"/>`)}
];
const STK=[['LOL!!!','#ff0'],['haha.jpg','#0ff'],['EPIC FAIL','#f6f'],['OMG!!1','#7f7'],['rofl','#fa0']];
const stkSVG=([t,c])=>`<svg viewBox="0 0 100 120"><circle cx="50" cy="50" r="42" fill="${c}" stroke="#000" stroke-width="4"/><ellipse cx="34" cy="38" rx="6" ry="10"/><ellipse cx="66" cy="38" rx="6" ry="10"/><path d="M22 58 Q50 98 78 58 Z" fill="#fff" stroke="#000" stroke-width="4"/><text x="50" y="114" font-family="Comic Sans MS,Comic Sans,cursive" font-weight="bold" font-size="17" text-anchor="middle" fill="${c}" stroke="#000" stroke-width="1">${t}</text></svg>`;

const F=(body,vb='0 0 120 90')=>`<svg viewBox="${vb}">${body}</svg>`;
const SHADES=(x,y,w)=>`<rect x="${x}" y="${y}" width="${w}" height="${w*.45}" fill="#111"/><rect x="${x+w+3}" y="${y}" width="${w}" height="${w*.45}" fill="#111"/><path d="M${x+w} ${y+3}h3" ${K}/>`;
const BIRDS=[
 F(`<path d="M10 50 Q40 20 60 46 Q80 20 112 50 Q84 40 66 56 L54 56 Q36 40 10 50Z" fill="#fff" ${K}/><ellipse cx="60" cy="56" rx="16" ry="12" fill="#fff" ${K}/><circle cx="68" cy="50" r="7" fill="#fff" ${K}/><path d="M74 50 L88 54 L74 56Z" fill="#ffb000" ${K}/>${SHADES(62,46,6)}`),
 F(`<ellipse cx="56" cy="58" rx="30" ry="20" fill="#f6d500" ${K}/><circle cx="82" cy="36" r="14" fill="#f6d500" ${K}/><path d="M94 36 L112 40 L94 44Z" fill="#ff7a00" ${K}/><circle cx="86" cy="33" r="3"/><path d="M76 22 L82 2 L90 22Z" fill="#ff2aa8" ${K}/><path d="M30 52 Q46 40 60 54" fill="none" ${K}/>`),
 F(`<ellipse cx="58" cy="56" rx="28" ry="18" fill="#8a93a8" ${K}/><circle cx="84" cy="40" r="12" fill="#8a93a8" ${K}/><path d="M95 40 L106 43 L95 46Z" fill="#333"/><circle cx="87" cy="37" r="3" fill="#f60"/><rect x="96" y="44" width="18" height="4" fill="#f5efe0" ${K}/><circle cx="115" cy="46" r="2.5" fill="#f60"/><path d="M50 74 L46 86M64 74 L66 86" ${K}/>`),
 F(`<path d="M8 46 L40 30 L60 44 L80 30 L112 46 L86 46 L60 60 L34 46Z" fill="#222" ${K}/><circle cx="60" cy="48" r="10" fill="#222" ${K}/><circle cx="56" cy="46" r="3" fill="#f00"/><circle cx="64" cy="46" r="3" fill="#f00"/>`)
];
const SEA=[
 F(`<path d="M8 60 Q30 20 80 30 Q100 34 112 50 Q96 52 86 58 Q60 72 30 64 L14 76 L18 60Z" fill="#7fa7c9" ${K}/><path d="M56 30 L64 12 L72 32Z" fill="#7fa7c9" ${K}/><path d="M86 58 Q96 66 106 62" fill="none" ${K}/>${SHADES(76,38,10)}`),
 F(`<path d="M6 60 Q40 30 90 40 L112 56 L90 66 Q50 80 6 60Z" fill="#9aa4ad" ${K}/><path d="M50 36 L62 6 L72 40Z" fill="#9aa4ad" ${K}/><path d="M88 52 L104 56 L88 60Z" fill="#fff" ${K}/><circle cx="86" cy="46" r="3"/><path d="M70 28 Q84 14 100 26 L104 32 L66 34Z" fill="#d40000" ${K}/>`),
 F(`<ellipse cx="60" cy="62" rx="30" ry="18" fill="#ffe100" ${K}/><circle cx="76" cy="38" r="15" fill="#ffe100" ${K}/><path d="M89 40 L104 44 L89 48Z" fill="#ff7a00" ${K}/><circle cx="80" cy="34" r="3"/>`),
 F(`<path d="M0 64 Q30 56 60 64 Q90 72 120 64 L120 90 L0 90Z" fill="#1a8fd6"/><circle cx="60" cy="44" r="16" fill="#f2c9a5" ${K}/><path d="M44 40 Q60 22 76 40Z" fill="#ff2a6d" ${K}/><rect x="50" y="42" width="8" height="5" fill="#111"/><rect x="62" y="42" width="8" height="5" fill="#111"/><path d="M52 52 Q60 58 68 52" fill="none" ${K}/><path d="M30 60 L40 50M90 60 L80 50" ${K}/>`)
];
const MONRAD=`<svg viewBox="0 0 120 120"><ellipse cx="60" cy="80" rx="44" ry="32" fill="#4caf3a" stroke="#000" stroke-width="3"/><circle cx="36" cy="44" r="16" fill="#4caf3a" stroke="#000" stroke-width="3"/><circle cx="84" cy="44" r="16" fill="#4caf3a" stroke="#000" stroke-width="3"/><circle cx="36" cy="44" r="8" fill="#fff"/><circle cx="84" cy="44" r="8" fill="#fff"/><circle cx="38" cy="45" r="4"/><circle cx="82" cy="45" r="4"/><path d="M30 80 Q60 104 90 80" fill="#c2185b" stroke="#000" stroke-width="3"/><text x="60" y="118" font-family="Comic Sans MS,cursive" font-weight="bold" font-size="18" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="1">Monrad</text></svg>`;
const ARM='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 150"><path d="M34 4 C2 14 0 52 12 70 C2 84 4 110 18 128 L24 146 L46 146 L48 126 C58 104 58 86 50 72 C66 50 64 18 34 4Z" fill="#e9b48f" stroke="#000" stroke-width="3"/><path d="M14 64 Q30 76 50 70M20 40 Q30 46 40 38M18 104 Q32 110 46 102" fill="none" stroke="#b07a55" stroke-width="2.5"/></svg>');

const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#armL').src=$('#armR').src=ARM;
$('#monrad').innerHTML=MONRAD;
const POOL={
  maal:()=>{const P=pick(PEOPLE);return P.s+`<p>${esc(pick(P.n))}</p>`},
  fugler:()=>pick(BIRDS), vann:()=>pick(SEA),
  brann:()=>pick(PEOPLE).s
};
/* ---------- helpers ---------- */
const add=(html,cls,css,parent)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;Object.assign(d.style,css||{});(parent||stage).appendChild(d);return d};
const ctr=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
const LEAF=`<svg viewBox="0 0 100 100"><g fill="#2e9e2e" stroke="#0b4a0b" stroke-width="2">${[-70,-40,-15,15,40,70].map(a=>`<path transform="rotate(${a} 50 80)" d="M50 80 Q45 50 50 22 Q55 50 50 80Z"/>`).join('')}<path d="M50 80 Q44 40 50 6 Q56 40 50 80Z"/><path d="M50 80 L50 98" stroke-width="3"/></g></svg>`;
function leaves(){const l=add(LEAF,'leaf',{left:R(-5,90)+'vw',top:'-80px',width:R(40,90)+'px'});later(3100,()=>l.remove())}
function puff(){const j=$('#joint'),r=j.getBoundingClientRect();if(!r.width)return;const p=add('','puff',{left:r.right-15+'px',top:r.top+'px'});later(2500,()=>p.remove())}
function sticker(){const s=add(stkSVG(pick(STK)),'stk',{left:R(2,78)+'vw',top:R(5,72)+'vh'});later(3700,()=>s.remove())}
function boomAt(x,y,big){
  for(let i=0;i<(big?28:16);i++){const a=R(0,6.28),d=R(80,big?320:220);const f=add('','frag',{left:x+'px',top:y+'px',background:pick(['#f00','#ff0','#000','#f80','#fff']),'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px'});later(1000,()=>f.remove())}
  const b=add(pick(big?['KABOOM','BOOM!!1']:['BOOM','PWNED','KABLAM','REKT','*zap*']),'boomtxt',{left:x+'px',top:y+'px'});later(950,()=>b.remove());
  sfx(big?'big':'boom');
}

/* ---------- targets ---------- */
const spots=[[3,8],[70,6],[3,62],[72,64],[38,4],[40,72],[2,34],[74,34]];
function item(cat){return POOL[cat]()}
function spawn(scene){
  let t;
  if(scene==='glide'){t=add(item('fugler'),'tgt free',{left:'100vw',top:R(4,55)+'vh'});t.firstElementChild&&t.classList.add('fly')}
  else if(scene==='water'){t=add(item('vann'),'tgt free',{left:R(4,70)+'vw',top:R(56,78)+'vh'});t.firstElementChild.classList.add('swim')}
  else if(scene==='fire'){t=add(item('brann'),'tgt free',{left:R(10,50)+'vw',top:R(8,70)+'vh'})}
  else{const [x,y]=pick(spots);t=add(item('maal'),'tgt card',{left:`min(${x}vw, calc(100vw - 200px))`,top:`min(${y}vh, calc(100vh - 230px))`,rotate:R(-8,8)+'deg'})}
  if(scene==='glide')t.classList.add('fly');
  const p=t.querySelector('p');if(p)later(250,()=>p.classList.add('in'));
  return t;
}
function fire(t){
  if(!t.isConnected)return;
  const eyes=[$('#e1'),$('#e2')];let n=0;
  beams.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);sfx('laser');
  const draw=()=>{
    if(!t.isConnected){beams.innerHTML='';return}
    const [cx,cy]=ctr(t);
    beams.innerHTML=eyes.map(e=>{const [x,y]=ctr(e),j=R(-6,6);return `<line x1="${x}" y1="${y}" x2="${cx+j}" y2="${cy+j}" stroke="#f00" stroke-width="${R(14,22)}" stroke-linecap="round" opacity=".55"/><line x1="${x}" y1="${y}" x2="${cx+j}" y2="${cy+j}" stroke="#fff" stroke-width="${R(3,6)}" stroke-linecap="round"/>`}).join('')+`<circle cx="${cx}" cy="${cy}" r="${R(20,40)}" fill="#ff0" opacity=".7"/>`;
    if(++n<20)requestAnimationFrame(draw);else{beams.innerHTML='';const [x,y]=ctr(t);t.style.transform=getComputedStyle(t).transform;t.classList.add('hit');boomAt(x,y);later(800,()=>t.remove())}
  };draw();
}
let laserOn=false;
function laserLoop(){if(!laserOn)return;const sc=stage.dataset.scene;const t=spawn(sc);later(sc==='glide'?R(1400,2200):R(900,1500),()=>fire(t));later(R(2000,2600),laserLoop)}

/* ---------- scenes ---------- */
const bgFx={snow:()=>{const tr=document.createElement('div');tr.className='tree';tr.style.top=R(20,60)+'vh';tr.style.animationDuration=R(1.6,2.8)+'s';$('#snow').appendChild(tr);later(3000,()=>tr.remove())},
  glide:()=>{const c=document.createElement('div');c.className='cloud';c.style.top=R(0,80)+'vh';c.style.animationDuration=R(4,8)+'s';$('#sky').appendChild(c);later(8200,()=>c.remove())},
  fire:()=>{if($('#city').querySelectorAll('.flame').length>8)return;const f=document.createElement('div');f.className='flame';f.style.left=R(10,60)+'%';f.style.top=R(5,90)+'%';$('#city').appendChild(f)}};
let fxTimer=null,vaterOn=false;
function setScene(id){
  stage.dataset.scene=id;
  clearInterval(fxTimer);
  if(bgFx[id])fxTimer=setInterval(bgFx[id],id==='fire'?1200:id==='glide'?900:450);
  if(id==='fire'){const ch=$('#char');ch.style.animation='none';void ch.offsetWidth;ch.style.animation=''}
  if(id==='snow'&&!vaterOn)dropVater();
}
function dropVater(){
  vaterOn=true;const v=$('#vater');v.style.display='block';void v.offsetWidth;
  later(600,()=>v.classList.add('land'));
  later(1300,()=>{const [x,y]=ctr($('#bday'));$('#flash').classList.remove('go');void $('#flash').offsetWidth;$('#flash').classList.add('go');boomAt(x,y,true);
    $('#bday').style.display='none';$('#cap').style.display='block';v.classList.add('bal')});
}
const CYCLE=[['snow',26000],['glide',24000],['water',24000],['fire',27000]];
function runCycle(i){const [id,ms]=CYCLE[i%CYCLE.length];setScene(id);later(ms,()=>runCycle(i+1))}

function start(e){
  if(e)e.preventDefault();if(started)return;started=true;
  play();unlock();
  $('#intro').style.display='none';stage.classList.add('on');document.body.style.background='#000';
  setScene('laser');stage.classList.add('party');
  later(150,()=>{$('#glasses').classList.add('down');$('#bday').classList.add('on')});
  later(2400,()=>$('#joint').classList.add('on'));
  const lv=setInterval(leaves,260),pf=setInterval(puff,700);
  later(6800,()=>{clearInterval(lv);$('#glasses').classList.remove('down');$('#glasses').classList.add('off');stage.classList.remove('party')});
  later(7900,()=>{const g=$('#glasses');if(g)g.remove()});
  later(7600,()=>{laserOn=true;laserLoop()});
  later(9000,()=>setInterval(sticker,3400));
  later(20000,()=>{clearInterval(pf);$('#joint').style.display='none'});
  later(28000,()=>runCycle(0));
}
$('#go').addEventListener('click',start);
// ?scene=fire etc. for quick testing
const q=new URLSearchParams(location.search).get('scene');
if(q){start();if(q!=='laser'){vaterOn=q!=='snow';if(vaterOn){$('#vater').style.display='block';$('#vater').classList.add('land','bal');$('#bday').style.display='none';$('#cap').style.display='block'}stage.classList.remove('party');laserOn=true;later(300,laserLoop);setScene(q)}}
}
</script>
</body>
